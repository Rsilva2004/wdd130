<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="If you need more informations or need some help about the rafting, contact us!">
    <meta name="author" content="Rafael Bruno Aranha da Silva">

    <title>White Water Rafting - Contact Us</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="z-wwr-crossedoars.png" alt="Rafting Logo" width="150">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>


        <section>
            <h1>Contact Us</h1>
            <h2>Send us a message:</h2>
            <p>Address: Three Hearts Street, n14 - New Horizon, Camaçari - Bahia, Brazil</p>
            <p>Phone: +55 (71) 98303-0456</p>
            <p>Email: rsilva24@byupathway.edu</p>
        </section>

        <section>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3892.2300275550037!2d-38.31416946747834!3d-12.698403987592414!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x716427eab88de71%3A0xb33c33f1a1316841!2sCaminho%20Tres%20Coracoes%2C%2014%20-%20Novo%20Horizonte%2C%20Cama%C3%A7ari%20-%20BA%2C%2042801-470!5e0!3m2!1spt-BR!2sbr!4v1780630856578!5m2!1spt-BR!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>

                <form>
                    <label for="fullname">Name:</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>

                    <div>Message purpose:
                        <label for="mp1">General Inquiry</label>
                        <input type="radio" id="mp1" name="message_purpose" required>

                        <label for="mp2">Reservation Question</label>
                        <input type="radio" id="mp2" name="message_purpose" required>

                        <label for="mp3">Website Suggestion</label>
                        <input type="radio" id="mp3" name="message_purpose" required>
                    </div>

                    <label for="feedback">Message:</label>
                    <textarea id="feedback" name="feedback" rows="4"
                      placeholder="Type here"></textarea>

                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                    <input type="checkbox" id="subscribe" name="newsletter">
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>


        <section>
            <h2>We Are Here To Serve You</h2>
            <div class="employees">
                <figure>
                    <img src="images/employee1.jpg" alt="Man to guide through the journey">
                    <figcaption>River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg"
                      alt="Woman who takes care about the reservations">
                    <figcaption>Reservations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg"
                      alt="Man who takes care about logistic and operations">
                    <figcaption>Operations Manager</figcaption>
                </figure>
            </div>
        </section>


    </main>

    <footer>

        <p>
            ©2026 White Water Rafting | Rafael Bruno Aranha da Silva
        </p>

        <nav class=" socialmedia">

            <!--I added my personal social media-->
            <a href="https://www.facebook.com/rafael.aranha.2025">
                <img src="images/facebook-bw.svg" alt="Facebook" width="80">
            </a>

            <a href="https://www.instagram.com/r.aranha04/">
                <img src="images/instagram-bw.svg" alt="Instagram" width="80">
            </a>

            <a href="https://www.linkedin.com/in/rafael-bruno-a02a173a3/">
                <img src="images/linkedin-bw.svg" alt="Twitter" width="80">
            </a>

        </nav>

    </footer>

</body>

</html>
